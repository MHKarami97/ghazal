<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b87c2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="غزل - کتابخانه شعر فارسی، آموزش ادبی، کاوش تبارشناسی و حفظ شعر با تکرار فاصله‌دار" />
    <link rel="icon" type="image/png" href="/icons/icon-48.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link href="/fonts/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <title>غزل | کتابخانه و آموزش شعر فارسی</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ghazal-theme');
          var isDark = theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-paper-light dark:bg-paper-dark text-ink-900 dark:text-ink-50 font-vazir antialiased min-h-screen selection:bg-brand-500/20 selection:text-brand-900 dark:selection:text-brand-200">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
