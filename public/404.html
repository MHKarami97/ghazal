<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>غزل | در حال هدایت به شعر...</title>
  <script>
    // SPA redirect for GitHub Pages and static hosting
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 50px; direction: rtl;">
  <p>در حال انتقال به صفحهٔ مورد نظر در اپلیکیشن غزل...</p>
</body>
</html>
